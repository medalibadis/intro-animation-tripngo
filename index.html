<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripnGo - Zauri Miminoshvili-Inspired Logo Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tng-navy: #07325B;
    --tng-darkblue: #0B3B66;
    --tng-deep: #020713;
    --tng-blue: #1E88C7;
    --tng-sky: #0090D9;
    --tng-green: #34D399;
    --tng-yellow: #F5B819;
    --tng-yellow-hover: #E5AA15;
    --font-main: 'Plus Jakarta Sans', 'Poppins', -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: radial-gradient(circle at 50% 15%, #0d1e38 0%, #01040a 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-main);
    overflow-x: hidden;
    padding: 24px 16px;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  /* Phone Chassis */
  .device-wrapper {
    position: relative;
    margin: 0 auto;
  }

  .device-container {
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 52px;
    box-shadow:
      0 40px 95px -20px rgba(0, 0, 0, 0.98),
      0 0 0 1px rgba(255, 255, 255, 0.14),
      0 0 0 12px #151e2e,
      0 0 0 14px #060b14,
      0 0 70px rgba(0, 144, 217, 0.2);
    position: relative;
    overflow: hidden;
  }

  .glass-glare {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 26%, transparent 48%);
    pointer-events: none;
    z-index: 150;
    border-radius: 52px;
  }

  /* Screen Surface: Pure, Clean, Deep TripnGo Brand Navy */
  .screen {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0B3B66 0%, #07325B 45%, #020713 100%);
  }

  /* Ambient Radial Glow */
  .bg-ambient {
    position: absolute;
    width: 160%;
    height: 160%;
    top: -30%;
    left: -30%;
    background: radial-gradient(circle at 50% 45%, rgba(0, 144, 217, 0.22) 0%, rgba(52, 211, 153, 0.08) 35%, transparent 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 116px;
    height: 30px;
    background: #000000;
    border-radius: 20px;
    z-index: 110;
    box-shadow: 0 1px 3px rgba(255, 255, 255, 0.05);
  }

  /* Status Bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 48px;
    padding: 0 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 105;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.95;
    pointer-events: none;
  }

  /* Motion Canvas for Calligraphic Stroke, Glowing Trail & Jet */
  #motionCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  /* Calligraphic Logo Master Wrapper */
  .logo-master-cluster {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
    will-change: transform;
  }

  /* Letter Nodes: Styled with dynamic write-on wipe */
  .letter-item {
    height: 52px;
    width: auto;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.9);
    clip-path: inset(0 100% 0 0); /* Write-on wipe from left to right! */
    will-change: clip-path, opacity, transform;
    user-select: none;
  }

  /* Soft Light Halo behind Logo */
  .logo-glow {
    position: absolute;
    width: 320px;
    height: 120px;
    background: radial-gradient(ellipse at center, rgba(52, 211, 153, 0.28) 0%, rgba(30, 136, 199, 0.2) 40%, rgba(245, 184, 25, 0.08) 65%, transparent 80%);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
    top: 48%;
    left: 50%;
    z-index: 2;
    pointer-events: none;
    filter: blur(16px);
    will-change: opacity, transform;
  }

  /* =========================================================================
     Welcome Screen Overlay (Post-Animation Travel Interface)
     ========================================================================= */
  .welcome-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #07325B 0%, #052445 42%, #020713 100%);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 56px 22px 32px;
    box-sizing: border-box;
    transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(0.95) translateY(16px);
  }

  .welcome-screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1) translateY(0);
  }

  /* Staggered entrance */
  .stagger-item {
    opacity: 0;
    transform: translateY(16px);
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .welcome-screen.active .stagger-item {
    opacity: 1;
    transform: translateY(0);
  }
  .welcome-screen.active .stagger-1 { transition-delay: 0.06s; }
  .welcome-screen.active .stagger-2 { transition-delay: 0.14s; }
  .welcome-screen.active .stagger-3 { transition-delay: 0.22s; }
  .welcome-screen.active .stagger-4 { transition-delay: 0.30s; }
  .welcome-screen.active .stagger-5 { transition-delay: 0.38s; }

  /* Brand Header */
  .welcome-brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
  }

  .welcome-logo {
    height: 32px;
    width: auto;
    object-fit: contain;
  }

  .welcome-tag {
    font-size: 11px;
    font-weight: 700;
    background: rgba(52, 211, 153, 0.12);
    color: var(--tng-green);
    border: 1px solid rgba(52, 211, 153, 0.35);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .welcome-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--tng-green);
    box-shadow: 0 0 8px var(--tng-green);
  }

  /* Hero Section */
  .welcome-hero {
    margin-top: 22px;
  }

  .welcome-title {
    color: #ffffff;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
  }

  .welcome-title .highlight-blue {
    color: #38bdf8;
  }
  .welcome-title .highlight-green {
    color: var(--tng-green);
  }

  .welcome-subtitle {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.5;
    margin-top: 8px;
    font-weight: 400;
  }

  /* Quick Category Tabs */
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }

  .tab-pill {
    padding: 8px 16px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-pill:hover, .tab-pill.active {
    background: linear-gradient(135deg, #1E88C7 0%, #0090D9 100%);
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 6px 16px rgba(0, 144, 217, 0.35);
  }

  /* Destination Carousel */
  .carousel-label-row {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .carousel-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .carousel-link {
    font-size: 12px;
    font-weight: 600;
    color: #38bdf8;
    text-decoration: none;
  }

  .destinations-carousel {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    overflow-x: hidden;
  }

  .destination-card {
    min-width: 158px;
    height: 185px;
    border-radius: 18px;
    background-size: cover;
    background-position: center;
    position: relative;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.14);
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .destination-card:hover {
    transform: translateY(-2px);
  }

  .dest-paris {
    background-image: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(2, 9, 20, 0.94) 100%), url('assets/paris.jpg');
  }

  .dest-dubai {
    background-image: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(2, 9, 20, 0.94) 100%), url('assets/dubai.jpg');
  }

  .dest-tag {
    font-size: 9px;
    font-weight: 800;
    color: #F5B819;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  .dest-city {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
  }

  .dest-price {
    font-size: 11px;
    color: #cbd5e1;
    margin-top: 2px;
  }
  .dest-price strong {
    color: #ffffff;
    font-weight: 700;
  }

  /* Bottom Actions */
  .welcome-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .primary-btn {
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, #F5B819 0%, #E5AA15 100%);
    border: none;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: #07325B;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 24px rgba(245, 184, 25, 0.4);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(245, 184, 25, 0.55);
  }

  .secondary-link {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
  }
  .secondary-link span {
    color: #38bdf8;
    cursor: pointer;
  }

  /* Controls Panel (Top) */
  .controls-bar {
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }

  .action-btn {
    background: #101c30;
    color: #f1f5f9;
    border: 1px solid #203350;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .action-btn:hover {
    background: #182b4a;
    border-color: #38bdf8;
    color: #ffffff;
    transform: translateY(-1px);
  }

  .speed-group {
    display: inline-flex;
    background: #0d1726;
    border: 1px solid #1d2e46;
    border-radius: 20px;
    padding: 3px;
  }
  .spd-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .spd-btn.active {
    background: #1E88C7;
    color: #ffffff;
  }
</style>
</head>
<body>

<!-- Controls Panel (Top) -->
<div class="controls-bar">
  <button id="replayBtn" class="action-btn" onclick="runAnimation()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    Replay Animation
  </button>

  <div class="speed-group">
    <button class="spd-btn" onclick="setSpeed(0.5, this)">0.5x Slow-Mo</button>
    <button class="spd-btn active" onclick="setSpeed(1.0, this)">1.0x Normal</button>
    <button class="spd-btn" onclick="setSpeed(1.5, this)">1.5x Fast</button>
  </div>
</div>

<!-- Device Container -->
<div class="device-wrapper" id="deviceWrapper">
  <div class="device-container">
    <div class="glass-glare"></div>

    <div class="screen">
      <!-- Clean Deep Navy Atmosphere -->
      <div class="bg-ambient" id="bgAmbient"></div>

      <!-- Dynamic Island & Status Bar -->
      <div class="dynamic-island"></div>
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M1 4h2v7H1V4zm4-2h2v9H5V2zm4-2h2v11H9V0zm4 4h2v7h-2V4z"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M0 2.5a2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1-5 0zm5 6a2.5 2.5 0 1 1 5 0 2.5 2.5 0 0 1-5 0zm5-3a2.5 2.5 0 1 1 5 0 2.5 2.5 0 0 1-5 0z"/></svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor"><rect x="1" y="1" width="18" height="9" rx="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="3" y="3" width="14" height="5" rx="1"/><path d="M20 4v3a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/></svg>
        </div>
      </div>

      <!-- Soft Light Halo behind Logo -->
      <div class="logo-glow" id="logoGlow"></div>

      <!-- Motion Canvas for Calligraphic Stylus, Glowing Flight Ribbon & Airplane -->
      <canvas id="motionCanvas" width="390" height="844"></canvas>

      <!-- Calligraphic Write-On Logo Cluster (T -> r -> i -> p -> n -> G -> o) -->
      <div class="logo-master-cluster" id="logoCluster">
        <img src="assets/let-t.png" alt="T" class="letter-item" id="letT">
        <img src="assets/let-r.png" alt="r" class="letter-item" id="letR">
        <img src="assets/let-i.png" alt="i" class="letter-item" id="letI">
        <img src="assets/let-p.png" alt="p" class="letter-item" id="letP">
        <img src="assets/let-n.png" alt="n" class="letter-item" id="letN">
        <img src="assets/let-g.png" alt="G" class="letter-item" id="letG">
        <img src="assets/let-o.png" alt="o" class="letter-item" id="letO">
      </div>

      <!-- Welcome Screen (Seamless Cross-Fade Transition at 2.3s) -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-brand-header stagger-item stagger-1">
          <img src="assets/logo-white.png" alt="TripnGo" class="welcome-logo">
          <span class="welcome-tag">Ready for Flight</span>
        </div>

        <div class="welcome-hero stagger-item stagger-2">
          <h1 class="welcome-title">
            Explore the world with <span class="highlight-blue">Trip</span><span class="highlight-green">nGo</span>.
          </h1>
          <p class="welcome-subtitle">
            Book flights, luxury hotels & premium experiences worldwide instantly.
          </p>
        </div>

        <!-- Quick Category Tabs -->
        <div class="category-tabs stagger-item stagger-3">
          <div class="tab-pill active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            Flights
          </div>
          <div class="tab-pill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M9 21V11m6 10V11M7 7l5-4 5 4"/></svg>
            Hotels
          </div>
          <div class="tab-pill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Deals
          </div>
        </div>

        <div class="carousel-label-row stagger-item stagger-4">
          <div class="carousel-label">Featured Destinations</div>
          <a href="#" class="carousel-link">Explore all</a>
        </div>

        <div class="destinations-carousel stagger-item stagger-4">
          <div class="destination-card dest-paris">
            <div class="dest-tag">Top Choice</div>
            <div class="dest-city">Paris, France</div>
            <div class="dest-price">From <strong>$320</strong></div>
          </div>
          <div class="destination-card dest-dubai">
            <div class="dest-tag">Popular</div>
            <div class="dest-city">Dubai, UAE</div>
            <div class="dest-price">From <strong>$460</strong></div>
          </div>
        </div>

        <div class="welcome-footer stagger-item stagger-5">
          <button class="primary-btn">
            <span>Explore Flights</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
          <div class="secondary-link">Already have an account? <span>Sign In</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('motionCanvas');
  const ctx = canvas.getContext('2d');
  const logoCluster = document.getElementById('logoCluster');
  const logoGlow = document.getElementById('logoGlow');
  const welcomeScreen = document.getElementById('welcomeScreen');
  const bgAmbient = document.getElementById('bgAmbient');

  // Letter Nodes
  const letters = [
    document.getElementById('letT'),
    document.getElementById('letR'),
    document.getElementById('letI'),
    document.getElementById('letP'),
    document.getElementById('letN'),
    document.getElementById('letG'),
    document.getElementById('letO')
  ];

  const BASE_DURATION = 2500; // 2.5s duration
  let speedMultiplier = 1.0;
  let startTime = null;
  let animId = null;

  // Harmonic Damped Spring Physics (Zauri Miminoshvili Formula)
  function spring(t, decay = 8, freq = 16) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-decay * t) * Math.cos(freq * t);
  }

  // =========================================================================
  // Typographic Stroke Vector Paths for Dynamic Handwriting Reveal
  // Canvas width: 390, height: 844. Logo centered at (195, 405)
  // =========================================================================
  const strokeSpecs = [
    {
      name: 'T',
      delay: 0.18,
      duration: 0.22,
      node: letters[0],
      color: '#0090D9',
      path: [
        { x: 80, y: 386 },
        { x: 124, y: 386 },
        { x: 104, y: 386 },
        { x: 104, y: 428 }
      ]
    },
    {
      name: 'r',
      delay: 0.32,
      duration: 0.18,
      node: letters[1],
      color: '#1E88C7',
      path: [
        { x: 136, y: 396 },
        { x: 136, y: 428 },
        { x: 136, y: 404 },
        { x: 156, y: 396 }
      ]
    },
    {
      name: 'i',
      delay: 0.44,
      duration: 0.18,
      node: letters[2],
      color: '#38BDF8',
      path: [
        { x: 168, y: 398 },
        { x: 168, y: 428 },
        { x: 168, y: 384 } // Dot pop
      ]
    },
    {
      name: 'p',
      delay: 0.54,
      duration: 0.22,
      node: letters[3],
      color: '#0090D9',
      path: [
        { x: 186, y: 396 },
        { x: 186, y: 442 },
        { x: 186, y: 396 },
        { x: 218, y: 408 },
        { x: 186, y: 426 }
      ]
    },
    {
      name: 'n',
      delay: 0.68,
      duration: 0.20,
      node: letters[4],
      color: '#F5B819',
      path: [
        { x: 228, y: 428 },
        { x: 228, y: 400 },
        { x: 246, y: 394 },
        { x: 260, y: 428 }
      ]
    },
    {
      name: 'G',
      delay: 0.80,
      duration: 0.22,
      node: letters[5],
      color: '#34D399',
      path: [
        { x: 298, y: 394 },
        { x: 268, y: 404 },
        { x: 272, y: 428 },
        { x: 298, y: 424 },
        { x: 298, y: 412 },
        { x: 284, y: 412 }
      ]
    },
    {
      name: 'o',
      delay: 0.94,
      duration: 0.20,
      node: letters[6],
      color: '#34D399',
      path: [
        { x: 326, y: 396 },
        { x: 308, y: 412 },
        { x: 326, y: 428 },
        { x: 344, y: 412 },
        { x: 326, y: 396 }
      ]
    }
  ];

  // Helper to sample along multi-point polyline
  function getPolylinePoint(path, u) {
    if (path.length === 1) return path[0];
    const totalSegments = path.length - 1;
    const seg = Math.min(Math.floor(u * totalSegments), totalSegments - 1);
    const segU = (u * totalSegments) - seg;
    const p0 = path[seg];
    const p1 = path[seg + 1];
    return {
      x: p0.x + (p1.x - p0.x) * segU,
      y: p0.y + (p1.y - p0.y) * segU
    };
  }

  // =========================================================================
  // Continuous Smooth Cubic Bézier Flight Path for Airplane
  // Perfectly smooth C1-spline taking off from the 'o' letter
  // =========================================================================
  const curve = {
    s1: {
      p0: { x: 344, y: 412 },    // Launches directly from 'o' loop
      p1: { x: 395, y: 450 },
      p2: { x: 360, y: 550 },
      p3: { x: 220, y: 520 }
    },
    s2: {
      p0: { x: 220, y: 520 },
      p1: { x: 80,  y: 490 },
      p2: { x: 25,  y: 340 },
      p3: { x: 150, y: 260 }
    },
    s3: {
      p0: { x: 150, y: 260 },
      p1: { x: 275, y: 180 },
      p2: { x: 375, y: 210 },
      p3: { x: 440, y: 120 }     // Ascends into stratosphere
    }
  };

  function getCubicPoint(p0, p1, p2, p3, t) {
    const cx = 3 * (p1.x - p0.x);
    const bx = 3 * (p2.x - p1.x) - cx;
    const ax = p3.x - p0.x - cx - bx;

    const cy = 3 * (p1.y - p0.y);
    const by = 3 * (p2.y - p1.y) - cy;
    const ay = p3.y - p0.y - cy - by;

    const xt = ax * Math.pow(t, 3) + bx * Math.pow(t, 2) + cx * t + p0.x;
    const yt = ay * Math.pow(t, 3) + by * Math.pow(t, 2) + cy * t + p0.y;
    return { x: xt, y: yt };
  }

  function getContinuousFlightPoint(t) {
    if (t < 0.333) {
      return getCubicPoint(curve.s1.p0, curve.s1.p1, curve.s1.p2, curve.s1.p3, t * 3);
    } else if (t < 0.666) {
      return getCubicPoint(curve.s2.p0, curve.s2.p1, curve.s2.p2, curve.s2.p3, (t - 0.333) * 3);
    } else {
      return getCubicPoint(curve.s3.p0, curve.s3.p1, curve.s3.p2, curve.s3.p3, (t - 0.666) * 3);
    }
  }

  // =========================================================================
  // Micro Stardust Particle System (Glowing embers trailing the stylus)
  // =========================================================================
  let particles = [];
  function spawnParticles(x, y, color, count = 2) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 6,
        y: y + (Math.random() - 0.5) * 6,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() - 0.5) * 1.8 - 0.5,
        radius: 1.0 + Math.random() * 2.2,
        color: color,
        life: 1.0,
        decay: 0.04 + Math.random() * 0.05
      });
    }
  }

  function updateAndDrawParticles() {
    ctx.save();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life * 0.85;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.restore();
  }

  // =========================================================================
  // Draw Stylus Luminous Core Spark with Dynamic Radial Illumination
  // =========================================================================
  function drawStylusSpark(x, y, radius, color, glowAlpha) {
    ctx.save();
    // Volumetric backlight illumination on navy canvas
    const ambientLight = ctx.createRadialGradient(x, y, 0, x, y, 45);
    ambientLight.addColorStop(0, `rgba(56, 189, 248, ${glowAlpha * 0.28})`);
    ambientLight.addColorStop(0.5, `rgba(0, 144, 217, ${glowAlpha * 0.12})`);
    ambientLight.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = ambientLight;
    ctx.beginPath();
    ctx.arc(x, y, 45, 0, Math.PI * 2);
    ctx.fill();

    // Outer luminous corona
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(x, y, radius * 2.4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = glowAlpha * 0.6;
    ctx.fill();

    // Pristine white energetic core
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 1.0;
    ctx.shadowColor = '#FFFFFF';
    ctx.shadowBlur = 10;
    ctx.fill();

    ctx.restore();
  }

  // =========================================================================
  // Draw Modern Supersonic Airplane with Dynamic 3D Banking Tilt
  // =========================================================================
  function drawAirplane(x, y, angle, bankAngle, scale, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale * (1 - Math.abs(bankAngle) * 0.25)); // Dynamic 3D perspective foreshortening
    ctx.globalAlpha = opacity;

    ctx.shadowColor = 'rgba(0, 144, 217, 0.65)';
    ctx.shadowBlur = 10;

    // Supersonic Delta-Wing Jet Body
    ctx.beginPath();
    ctx.moveTo(20, 0);          // Nose needle
    ctx.lineTo(6, -3.2);        // Cockpit port
    ctx.lineTo(-3, -15);        // Port wingtip
    ctx.lineTo(-7, -15);
    ctx.lineTo(-4, -2.8);       // Wing root
    ctx.lineTo(-17, -2.8);
    ctx.lineTo(-23, -7.5);      // Port stabilizer
    ctx.lineTo(-26, -7.5);
    ctx.lineTo(-23, 0);         // Tail engine cone
    ctx.lineTo(-26, 7.5);
    ctx.lineTo(-23, 7.5);       // Starboard stabilizer
    ctx.lineTo(-17, 2.8);
    ctx.lineTo(-4, 2.8);
    ctx.lineTo(-7, 15);
    ctx.lineTo(-3, 15);         // Starboard wingtip
    ctx.lineTo(6, 3.2);
    ctx.closePath();

    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    // Jet cockpit canopy (Reflective Cyan Glass)
    ctx.beginPath();
    ctx.ellipse(4, 0, 6, 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#38BDF8';
    ctx.fill();

    // Fuselage accent stripe (TripnGo Sky Blue)
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(-12, 0);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#1E88C7';
    ctx.stroke();

    // Engine Afterburner Flare
    ctx.beginPath();
    ctx.arc(-24, 0, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#F5B819';
    ctx.shadowColor = '#F5B819';
    ctx.shadowBlur = 12;
    ctx.fill();

    ctx.restore();
  }

  // =========================================================================
  // Draw Specular Crystalline Lens Sheen Sweep across Logo
  // =========================================================================
  function drawSpecularSheen(sheenProgress) {
    if (sheenProgress <= 0 || sheenProgress >= 1.0) return;
    ctx.save();
    // Sheen sweeps across the logo area from left (x=60) to right (x=330)
    const sweepX = 60 + sheenProgress * 270;
    const sheenGrad = ctx.createLinearGradient(sweepX - 35, 380, sweepX + 35, 430);
    sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    sheenGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.45)');
    sheenGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
    sheenGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.5)');
    sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

    ctx.fillStyle = sheenGrad;
    ctx.beginPath();
    // Parallelogram flash beam across the logo height
    ctx.moveTo(sweepX - 25, 370);
    ctx.lineTo(sweepX + 25, 370);
    ctx.lineTo(sweepX + 5, 440);
    ctx.lineTo(sweepX - 45, 440);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // =========================================================================
  // Draw Sonic Ring Shockwave on Logo Settle
  // =========================================================================
  function drawSonicPulse(pulseProgress) {
    if (pulseProgress <= 0 || pulseProgress >= 1.0) return;
    ctx.save();
    const radius = 25 + pulseProgress * 120;
    const alpha = (1 - pulseProgress) * 0.45;
    ctx.beginPath();
    ctx.arc(195, 410, radius, 0, Math.PI * 2);
    ctx.lineWidth = 2.5 * (1 - pulseProgress);
    ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
    ctx.shadowColor = '#38BDF8';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.restore();
  }

  // =========================================================================
  // Master 60 FPS Animation Engine (2.5s Execution)
  // =========================================================================
  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const duration = BASE_DURATION / speedMultiplier;
    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1.0);
    const sec = progress * 2.5;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // =========================================================================
    // Phase 1: 0.18s - 1.14s: Calligraphic Stylus & Letter Vector Reveal
    // =========================================================================
    let activeStylus = null;

    strokeSpecs.forEach((spec, i) => {
      const node = spec.node;
      if (sec >= spec.delay) {
        const u = Math.min((sec - spec.delay) / spec.duration, 1.0);
        const s = spring(u, 7, 15);

        // Dynamic fluid write-on wipe from left to right
        node.style.opacity = Math.min(u * 3.2, 1.0);
        const wipePercent = (1 - u) * 100;
        node.style.clipPath = `inset(0 ${wipePercent}% 0 0)`;

        // Staggered physical spring bounce per letter
        const scaleVal = 0.90 + 0.10 * s;
        node.style.transform = `scale(${scaleVal})`;

        // Sample exact typographic vector path for stylus position
        if (u > 0 && u < 1.0) {
          const pt = getPolylinePoint(spec.path, u);
          activeStylus = { x: pt.x, y: pt.y, color: spec.color, alpha: Math.sin(u * Math.PI) };
          spawnParticles(pt.x, pt.y, spec.color, 1);
        }
      } else {
        node.style.opacity = '0';
        node.style.clipPath = 'inset(0 100% 0 0)';
      }
    });

    // Draw active calligraphic spark & stardust particles
    if (activeStylus && sec < 1.15) {
      drawStylusSpark(activeStylus.x, activeStylus.y, 4.0, activeStylus.color, activeStylus.alpha);
    }
    updateAndDrawParticles();

    // Ambient Halo activates gently as letters complete
    if (sec >= 0.45) {
      const u = Math.min((sec - 0.45) / 0.6, 1.0);
      logoGlow.style.opacity = `${u * 0.8}`;
      logoGlow.style.transform = `translate(-50%, -50%) scale(${0.85 + 0.15 * u})`;
    }

    // =========================================================================
    // Phase 2: 1.14s - 2.18s: Jet Flight, Banking Dynamics & Glowing Contrail
    // =========================================================================
    if (sec >= 1.14 && sec <= 2.22) {
      const flightP = Math.min((sec - 1.14) / 0.98, 1.0);
      // Fluid cubic velocity profile
      const easeFlight = flightP < 0.5
        ? 4 * flightP * flightP * flightP
        : 1 - Math.pow(-2 * flightP + 2, 3) / 2;

      const totalSamples = 100;
      const currentSamples = Math.floor(totalSamples * easeFlight);

      if (currentSamples > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Wide soft glow under-ribbon
        ctx.shadowColor = 'rgba(0, 144, 217, 0.5)';
        ctx.shadowBlur = 12;

        for (let i = 0; i < currentSamples - 1; i++) {
          const t1 = i / totalSamples;
          const t2 = (i + 1) / totalSamples;

          const pt1 = getContinuousFlightPoint(t1);
          const pt2 = getContinuousFlightPoint(t2);

          // Tapered organic width (1.8px to 3.4px)
          ctx.lineWidth = 1.8 + 1.6 * Math.sin((i / currentSamples) * Math.PI);

          // TripnGo Signature Gradient: Sky Blue -> Mint Green -> Gold
          const grad = ctx.createLinearGradient(pt1.x, pt1.y, pt2.x, pt2.y);
          if (t1 < 0.36) {
            grad.addColorStop(0, 'rgba(0, 144, 217, 0.15)');
            grad.addColorStop(1, 'rgba(0, 144, 217, 0.95)');
          } else if (t1 < 0.70) {
            grad.addColorStop(0, 'rgba(0, 144, 217, 0.95)');
            grad.addColorStop(1, 'rgba(52, 211, 153, 0.98)');
          } else {
            grad.addColorStop(0, 'rgba(52, 211, 153, 0.98)');
            grad.addColorStop(1, 'rgba(245, 184, 25, 1)');
          }

          ctx.beginPath();
          ctx.moveTo(pt1.x, pt1.y);
          ctx.lineTo(pt2.x, pt2.y);
          ctx.strokeStyle = grad;
          ctx.stroke();
        }

        ctx.restore();
      }

      // Draw Jet with 3D Banking Angle along trajectory
      if (easeFlight > 0 && easeFlight < 1) {
        const curPt = getContinuousFlightPoint(easeFlight);
        const nextPt = getContinuousFlightPoint(Math.min(easeFlight + 0.014, 1.0));
        const prevPt = getContinuousFlightPoint(Math.max(easeFlight - 0.014, 0.0));

        const heading = Math.atan2(nextPt.y - curPt.y, nextPt.x - curPt.x);
        const prevHeading = Math.atan2(curPt.y - prevPt.y, curPt.x - prevPt.x);
        const bankAngle = (heading - prevHeading) * 12; // Natural banking into curves

        const planeOpacity = flightP < 0.10 ? flightP * 10 : (flightP > 0.88 ? (1 - flightP) * 8.3 : 1.0);
        const planeScale = 0.74 + 0.26 * Math.sin(flightP * Math.PI);

        drawAirplane(curPt.x, curPt.y, heading, bankAngle, planeScale, Math.min(planeOpacity, 1.0));
        spawnParticles(curPt.x, curPt.y, '#38BDF8', 1);
      }
    }

    // =========================================================================
    // Phase 3: 1.95s - 2.50s: Specular Sheen, Sonic Pulse & Elastic Settle
    // =========================================================================
    if (sec >= 1.95) {
      // Specular sheen sweeps cleanly across brand name
      const sheenP = Math.min((sec - 1.95) / 0.35, 1.0);
      drawSpecularSheen(sheenP);
    }

    if (sec >= 2.02) {
      // Sonic shockwave ring pulse
      const pulseP = Math.min((sec - 2.02) / 0.40, 1.0);
      drawSonicPulse(pulseP);

      // Staggered harmonic bounce across letters
      const settleP = Math.min((sec - 2.02) / 0.48, 1.0);
      const bounce = Math.exp(-6 * settleP) * Math.sin(14 * settleP * Math.PI) * 0.06;

      logoCluster.style.transform = `translate(-50%, -50%) scale(${1.0 + bounce})`;
      logoGlow.style.opacity = `${0.75 + bounce * 3}`;
      logoGlow.style.transform = `translate(-50%, -50%) scale(${1.0 + bounce * 2})`;

      if (sec >= 2.28) {
        welcomeScreen.classList.add('active');
      }
    }

    if (progress < 1.0) {
      animId = requestAnimationFrame(animate);
    }
  }

  function runAnimation() {
    if (animId) cancelAnimationFrame(animId);
    startTime = null;
    particles = [];
    letters.forEach(node => {
      node.style.opacity = '0';
      node.style.clipPath = 'inset(0 100% 0 0)';
      node.style.transform = 'scale(0.90)';
    });
    logoCluster.style.transform = 'translate(-50%, -50%) scale(1)';
    logoGlow.style.opacity = '0';
    welcomeScreen.classList.remove('active');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    animId = requestAnimationFrame(animate);
  }

  function setSpeed(spd, btn) {
    speedMultiplier = spd;
    document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    runAnimation();
  }

  // Start on initial page load
  window.addEventListener('load', () => {
    runAnimation();
  });
</script>
